<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — Reynald</title>
<link href="https://fonts.bunny.net/css?family=inter:400,500,600,700|dm-mono:400,500" rel="stylesheet">
<style>
:root{
  --navy:#0f2044;--navy2:#1a3260;--navy3:#243f7a;--accent:#2563eb;--accent2:#3b82f6;
  --surface:#f0f4f8;--surface2:#e2e8f0;--white:#ffffff;
  --text:#0f172a;--text2:#334155;--text3:#64748b;
  --border:#cbd5e1;--border2:#94a3b8;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --blue-bg:#eff6ff;--blue-border:#bfdbfe;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--surface);color:var(--text);min-height:100vh;}

/* PIN */
#pin-screen{display:none;position:fixed;inset:0;background:var(--navy);z-index:1000;align-items:center;justify-content:center;flex-direction:column;}
.pin-box{background:var(--navy2);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:48px 44px;width:90%;max-width:380px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.pin-logo{font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#93c5fd;margin-bottom:6px;}
.pin-sub{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:32px;}
.pin-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:10px;}
#pin-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-family:'DM Mono',monospace;font-size:28px;letter-spacing:.4em;text-align:center;padding:14px;outline:none;margin-bottom:14px;}
#pin-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2);}
.pin-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px;cursor:pointer;transition:background .15s;}
.pin-btn:hover{background:var(--accent2);}
#pin-error{display:none;font-size:12px;color:#f87171;margin-top:10px;}

#app{display:none;}
#loading{display:none;position:fixed;inset:0;background:var(--surface);z-index:900;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
#offline-banner{display:none;background:#fffbeb;border-bottom:1px solid #fcd34d;padding:8px 24px;font-size:12px;color:#92400e;}

/* TOP HEADER */
.top-bar{background:var(--navy);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.app-brand{display:flex;align-items:center;gap:12px;}
.app-brand-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.app-title{font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff;}
.top-right{display:flex;align-items:center;gap:16px;}
.top-date{font-size:11px;color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;}
.lock-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;cursor:pointer;transition:all .15s;}
.lock-btn:hover{background:rgba(255,255,255,.15);color:#fff;}

/* TOP NAV TABS */
.top-nav{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.08);padding:0 32px;display:flex;align-items:center;gap:2px;overflow-x:auto;}
.top-nav::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;gap:7px;padding:14px 18px;font-size:12px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.45);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;text-transform:uppercase;}
.nav-tab:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.05);}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent2);background:rgba(255,255,255,.06);}
.nav-tab-badge{font-size:10px;font-weight:700;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 7px;color:rgba(255,255,255,.5);}
.nav-tab.active .nav-tab-badge{background:var(--accent);color:#fff;}
.nav-tab-badge.urgent{background:#dc2626;color:#fff;}

/* SUB-NAV (secondary tabs for task categories / expense sections) */
.sub-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;gap:2px;overflow-x:auto;}
.sub-nav::-webkit-scrollbar{display:none;}
.sub-tab{padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.sub-tab:hover{color:var(--text2);}
.sub-tab.active{color:var(--navy);border-bottom-color:var(--navy);}
.sub-tab-badge{font-size:10px;font-weight:700;background:var(--surface2);border-radius:20px;padding:1px 6px;color:var(--text3);margin-left:4px;}
.sub-tab.active .sub-tab-badge{background:var(--navy);color:#fff;}

/* STATS BAR */
.stats-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;gap:0;}
.stat-item{padding:14px 24px;display:flex;align-items:center;gap:10px;border-right:1px solid var(--border);}
.stat-item:first-child{padding-left:0;}
.stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stat-icon.red{background:var(--red-bg);}
.stat-icon.amber{background:var(--amber-bg);}
.stat-icon.green{background:var(--green-bg);}
.stat-val{font-size:22px;font-weight:700;color:var(--text);line-height:1;}
.stat-val.red{color:var(--red);}
.stat-val.amber{color:var(--amber);}
.stat-val.green{color:var(--green);}
.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-top:1px;}

/* MAIN CONTENT */
.main{padding:28px 32px 100px;max-width:960px;margin:0 auto;}

/* BUTTONS */
.btn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 16px;border-radius:6px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy2);}
.btn-success{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.btn-success:hover{background:#dcfce7;}
.btn-info{background:var(--blue-bg);color:var(--accent);border:1px solid var(--blue-border);}
.btn-info:hover{background:#dbeafe;}
.btn-dark{background:var(--navy);color:#fff;}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
.btn-blue{background:var(--blue-bg);color:var(--accent);border:1px solid var(--blue-border);}
.btn-cancel{font-size:12px;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;}
.btn-save{font-size:12px;font-weight:700;padding:9px 18px;border-radius:6px;border:none;background:var(--navy);color:#fff;cursor:pointer;}
.btn-del{font-size:12px;font-weight:600;padding:9px 14px;border-radius:6px;border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer;margin-right:auto;}

/* ADD BAR */
.add-bar{background:#fff;border:2px dashed var(--border);border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer;transition:all .15s;}
.add-bar:hover{border-color:var(--accent);background:var(--blue-bg);}
.add-icon{width:28px;height:28px;border-radius:6px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:18px;}
.add-ph{font-size:13px;color:var(--text3);}

/* TASK ROWS */
.task-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;background:#fff;border:1px solid var(--border);border-top:none;cursor:pointer;transition:all .12s;}
.task-row:hover{background:var(--blue-bg);border-color:var(--accent2);}
.task-row.done-row{background:var(--surface2);opacity:.7;}
.task-row:last-child{border-radius:0 0 8px 8px;margin-bottom:12px;}
.check{width:18px;height:18px;min-width:18px;border-radius:50%;border:2px solid var(--border2);margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.check:hover{border-color:var(--accent);}
.check.checked{background:var(--green);border-color:var(--green);}
.check.checked::after{content:'✓';font-size:9px;color:#fff;font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:13px;line-height:1.5;color:var(--text);font-weight:500;}
.task-text.struck{text-decoration:line-through;color:var(--text3);font-weight:400;}
.task-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center;}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;}
.t-urgent{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.t-pending{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.task-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
.bucket-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-radius:8px 8px 0 0;margin-bottom:1px;}
.bucket-lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.bucket-cnt{font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--navy);border-radius:6px;margin:8px 0 3px;}
.cat-hdr-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#93c5fd;}
.cat-hdr-cnt{font-size:9px;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 7px;color:rgba(255,255,255,.6);}
.sec{margin-bottom:24px;}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);white-space:nowrap;}
.sec-line{flex:1;height:1px;background:var(--border);}
.sec-cnt{font-size:11px;color:var(--text3);}
.empty{color:var(--text3);font-size:13px;padding:40px 0;text-align:center;}

/* HOME CARDS */
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
.home-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.home-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(37,99,235,.1);transform:translateY(-1px);}
.home-card-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;}
.home-card-num{font-size:40px;font-weight:700;color:var(--text);line-height:1;margin-bottom:6px;}
.home-card-sub{font-size:11px;color:var(--text3);}
.home-card-icon{font-size:24px;margin-bottom:12px;}

/* EXPENSE CARDS */
.exp-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:6px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.exp-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(37,99,235,.1);}
.exp-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.exp-store{font-size:14px;font-weight:700;color:var(--text);}
.exp-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.exp-amt{font-size:20px;font-weight:700;color:var(--green);white-space:nowrap;}
.exp-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.exp-pill{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.exp-del{margin-left:auto;background:none;border:none;color:var(--border2);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;}
.exp-del:hover{color:var(--red);background:var(--red-bg);}
.exp-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.exp-total-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:6px;}
.exp-total-num{font-size:36px;font-weight:700;color:var(--text);line-height:1;}
.exp-total-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-sel{font-size:12px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 12px;outline:none;cursor:pointer;}
.filter-sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.filter-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);white-space:nowrap;}
.filter-clear{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1px solid var(--red-border);background:var(--red-bg);color:var(--red);cursor:pointer;}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.exp-form{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:16px;}
.exp-form-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}

/* MODALS */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,32,68,.6);z-index:400;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:12px;width:92%;max-width:460px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.2);border-top:4px solid var(--accent);max-height:90vh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:24px;}
.field{margin-bottom:16px;}
.field-lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:6px;}
.field-inp{width:100%;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;outline:none;transition:border-color .15s;}
.field-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;align-items:center;}
.done-btn{width:100%;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:11px;border-radius:6px;border:2px solid var(--green-border);background:var(--green-bg);color:var(--green);cursor:pointer;margin-top:12px;}

/* BACK TO TOP */
#back-to-top{position:fixed;bottom:28px;right:28px;width:44px;height:44px;background:var(--navy);color:#fff;border:none;border-radius:50%;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(15,32,68,.4);z-index:300;transition:all .2s;}
#back-to-top:hover{background:var(--navy2);transform:translateY(-2px);}
#back-to-top.visible{display:flex;}

/* DRAWER (mobile) */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--navy);z-index:201;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:24px 0;}
.drawer.open{transform:translateX(0);}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px;}
.drawer-title{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#93c5fd;}
.drawer-close{background:none;border:none;cursor:pointer;font-size:18px;color:rgba(255,255,255,.4);}
.drawer .nav-tab{border-radius:6px;margin:2px 12px;padding:12px 14px;border-bottom:none;border-left:3px solid transparent;color:rgba(255,255,255,.5);}
.drawer .nav-tab.active{border-left-color:var(--accent2);border-bottom:none;background:rgba(255,255,255,.08);color:#fff;}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:22px;}

@media(max-width:680px){
  .hamburger{display:block;}
  .top-nav{display:none;}
  .top-bar{padding:0 16px;}
  .main{padding:20px 16px 100px;}
  .home-grid{grid-template-columns:1fr;}
  .stats-bar{padding:0 16px;overflow-x:auto;}
  .stat-item{padding:12px 16px;}
}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">Command Center</div>
    <div class="pin-sub">Personal Operations</div>
    <div class="pin-label">Enter your PIN</div>
    <input type="password" id="pin-input" maxlength="8" inputmode="numeric" placeholder="••••">
    <button class="pin-btn" onclick="submitPin()">Unlock</button>
    <div id="pin-error">Incorrect PIN. Try again.</div>
  </div>
</div>

<div id="app">
  <div id="loading"><div class="spinner"></div><div class="loading-text">Connecting...</div></div>
  <div id="offline-banner">⚠️ Offline mode — changes saved on this device only.</div>

  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-hdr">
      <span class="drawer-title">Navigation</span>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div id="drawer-nav"></div>
  </div>

  <!-- TASK EDIT -->
  <div class="overlay" id="task-modal">
    <div class="modal">
      <div class="modal-title">Edit task</div>
      <div class="field"><label class="field-lbl">Task</label><textarea class="field-inp" id="tm-text" rows="3" style="resize:none;"></textarea></div>
      <div class="field"><label class="field-lbl">Category</label>
        <select class="field-inp" id="tm-cat">
          <option value="vehicles">Vehicles / logistics</option><option value="nila">Nación Nila</option>
          <option value="florida">Florida move</option><option value="property">Property</option>
          <option value="legal">Legal / divorce</option><option value="personal">Personal</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Priority</label>
        <select class="field-inp" id="tm-tag"><option value="pending">Pending</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="field"><label class="field-lbl">Due date</label><input class="field-inp" id="tm-date" type="date"></div>
      <div class="modal-actions">
        <button class="btn-del" onclick="deleteTask()">Delete</button>
        <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
        <button class="btn-save" onclick="saveTask()">Save</button>
      </div>
      <button class="done-btn" onclick="markDone()">✓ Mark as complete</button>
    </div>
  </div>

  <!-- ADD TASK -->
  <div class="overlay" id="add-task-modal">
    <div class="modal">
      <div class="modal-title">New task</div>
      <div class="field"><label class="field-lbl">Description</label><textarea class="field-inp" id="at-text" rows="3" style="resize:none;" placeholder="What needs to be done?"></textarea></div>
      <div class="field"><label class="field-lbl">Category</label>
        <select class="field-inp" id="at-cat">
          <option value="personal">Personal</option><option value="vehicles">Vehicles / logistics</option>
          <option value="nila">Nación Nila</option><option value="florida">Florida move</option>
          <option value="property">Property</option><option value="legal">Legal / divorce</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Priority</label>
        <select class="field-inp" id="at-tag"><option value="pending">Pending</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="field"><label class="field-lbl">Due date (optional)</label><input class="field-inp" id="at-date" type="date"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddTask()">Cancel</button>
        <button class="btn-save" onclick="submitTask()">Add task</button>
      </div>
    </div>
  </div>

  <!-- EXPENSE EDIT -->
  <div class="overlay" id="exp-modal">
    <div class="modal">
      <div class="modal-title">Edit expense</div>

function parseDate(s){
  if(!s)return null;
  const sl=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);
  if(sl)return new Date(sl[3]||new Date().getFullYear(),parseInt(sl[1])-1,parseInt(sl[2]));
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso)return new Date(parseInt(iso[1]),parseInt(iso[2])-1,parseInt(iso[3]));
  const p=s.trim().toLowerCase().split(/\s+/);
  if(p.length>=2){const m=MONTHS[p[0].substring(0,3)];const d=parseInt(p[1]);if(m!==undefined&&!isNaN(d))return new Date(new Date().getFullYear(),m,d);}
  return null;
}
function dateBucket(s){
  const d=parseDate(s);if(!d)return'nodate';
  const t=new Date();t.setHours(0,0,0,0);
  const diff=Math.floor((d-t)/86400000);
  if(diff<0)return'overdue';if(diff===0)return'today';if(diff<=7)return'thisweek';return'upcoming';
}
function todayISO2(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().split('T')[0];}
function getFiltered(data){
  return data.filter(e=>{
    if(expCatFilter&&(e.category||'')!==expCatFilter)return false;
    if(expMonthFilter&&e.date){const[fy,fm]=expMonthFilter.split('-');const[ey,em]=(e.date||'').split('-');if(ey!==fy||em!==fm)return false;}
    return true;
  });
}
function dateToISO(s){const d=parseDate(s);if(!d)return'';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split('T')[0];}
function isoToDisplay(raw){if(!raw)return'';const[y,m,d]=raw.split('-');return MN[parseInt(m)-1]+' '+parseInt(d);}

  else{html+=filtered.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)).map(expCard).join('');}

}

window.showAddExpForm=function(){const f=document.getElementById('exp-add-form');if(f)f.style.display=f.style.display==='none'?'block':'none';};

function expCard(e){
  const card=e.card?`<span class="exp-pill">💳 ${e.card}</span>`:'';
  const cat=e.category?`<span class="exp-pill">${e.category}</span>`:'';
  const loc=e.location?`<span class="exp-pill">📍 ${e.location}</span>`:'';
  const date=e.date?`<span class="exp-pill">📅 ${fmtDate(e.date)}</span>`:'';
  return`<div class="exp-card" onclick="openExpModal('${e.id}')"><div class="exp-top"><div><div class="exp-store">${e.store||'Unknown'}</div><div class="exp-desc">${e.item||''}</div></div><div class="exp-amt">$${parseFloat(e.amount||0).toFixed(2)}</div></div><div class="exp-meta">${card}${cat}${loc}${date}<button class="exp-del" onclick="event.stopPropagation();quickDel('${e.id}')">✕</button></div></div>`;
}

// ── TASK CRUD ─────────────────────────────────────────────────
window.toggleTask=async function(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  if(firebaseReady)await updateDoc(doc(db,'tasks',id),{done:!t.done});
  else{t.done=!t.done;saveLocal();render();}
};
window.openTaskModal=function(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  editingTaskId=id;
  document.getElementById('tm-text').value=t.text||'';
  document.getElementById('tm-cat').value=t.cat||'personal';
  document.getElementById('tm-tag').value=t.tag||'pending';
  document.getElementById('tm-date').value=dateToISO(t.date||'');
  document.getElementById('task-modal').classList.add('open');
};
window.closeTaskModal=function(){document.getElementById('task-modal').classList.remove('open');editingTaskId=null;};
window.saveTask=async function(){
  const text=document.getElementById('tm-text').value.trim();
  const cat=document.getElementById('tm-cat').value;
  const tag=document.getElementById('tm-tag').value;
  const date=isoToDisplay(document.getElementById('tm-date').value);
  if(firebaseReady)await updateDoc(doc(db,'tasks',editingTaskId),{text,cat,tag,date});
  else{const t=tasks.find(x=>x.id===editingTaskId);if(t)Object.assign(t,{text,cat,tag,date});saveLocal();render();}
  closeTaskModal();
};
window.deleteTask=async function(){
  if(!confirm('Delete this task?'))return;
  if(firebaseReady)await deleteDoc(doc(db,'tasks',editingTaskId));
  else{tasks=tasks.filter(x=>x.id!==editingTaskId);saveLocal();render();}
  closeTaskModal();
};
window.markDone=async function(){
  if(firebaseReady)await updateDoc(doc(db,'tasks',editingTaskId),{done:true});
  else{const t=tasks.find(x=>x.id===editingTaskId);if(t)t.done=true;saveLocal();render();}
  closeTaskModal();
};
window.openAddTask=function(){
  const valid=['vehicles','nila','florida','property','legal','personal'];
  document.getElementById('at-cat').value=valid.includes(activeTaskCat)?activeTaskCat:'personal';
  document.getElementById('at-text').value='';document.getElementById('at-tag').value='pending';document.getElementById('at-date').value='';
  document.getElementById('add-task-modal').classList.add('open');
  setTimeout(()=>document.getElementById('at-text').focus(),100);
};
window.closeAddTask=function(){document.getElementById('add-task-modal').classList.remove('open');};
window.submitTask=async function(){
  const text=document.getElementById('at-text').value.trim();if(!text)return;
  const cat=document.getElementById('at-cat').value;
  const tag=document.getElementById('at-tag').value;
  const date=isoToDisplay(document.getElementById('at-date').value);
  const t={text,cat,tag,date,done:false,createdAt:Date.now()};
  if(firebaseReady)await addDoc(tasksCol,t);
  else{tasks.push({...t,id:String(Date.now())});saveLocal();render();}
  closeAddTask();
};

function getCol(){return activeExpSec==='lithonia'?litCol:expCol;}

window.deleteExpense=async function(){

window.quickDel=async function(id){

window.submitExpForm=async function(){
  const store=document.getElementById('ef-store').value.trim();

  const e={store,amount,item:document.getElementById('ef-item').value.trim(),card:document.getElementById('ef-card').value,category:document.getElementById('ef-cat').value,date:document.getElementById('ef-date').value,location:document.getElementById('ef-loc').value.trim(),addedAt:Date.now()};

// ── EXPORT ────────────────────────────────────────────────────
window.exportExcel=function(){
  const data=getFiltered(getArr());
  const label=activeExpSec==='lithonia'?'Lithonia':'Florida';
  if(!data.length){alert('No expenses to export.');return;}
  const h=['Date','Store','Description','Amount','Category','Card','Location'];
  const rows=[...data].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).map(e=>[e.date||'',e.store||'',e.item||'',parseFloat(e.amount||0).toFixed(2),e.category||'',e.card||'',e.location||'']);
  rows.push(['','','TOTAL',data.reduce((s,e)=>s+(parseFloat(e.amount)||0),0).toFixed(2),'','','']);
  const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=label+'_Expenses_'+todayISO()+'.csv';a.click();
  URL.revokeObjectURL(url);
};

window.generateReport=function(){
  const data=getFiltered(getArr());
  const label=activeExpSec==='lithonia'?'Lithonia, GA':'Pembroke Pines, FL';
  const title=activeExpSec==='lithonia'?'Lithonia Expenses Report':'Florida Expenses Report';

  data.forEach(e=>{const c=e.category||'Other';if(!byCat[c])byCat[c]=[];byCat[c].push(e);});

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><link href="https://fonts.bunny.net/css?family=cormorant-garamond:300,400,500,600|montserrat:300,400,500,600,700" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Montserrat,sans-serif;background:#f5f2ec;}.cover{background:#1a1917;color:#fff;padding:48px 56px;border-bottom:3px solid #b8976a;}.cl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#b8976a;margin-bottom:8px;}.ct{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;margin-bottom:4px;}.cs{font-size:12px;color:rgba(255,255,255,.4);}.meta{margin-top:24px;display:flex;gap:48px;}.ml{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.3);margin-bottom:4px;}.mv{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:#b8976a;}.ms{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px;}.body{padding:40px 56px;}table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.06);}thead tr{background:#f0ede8;}thead th{padding:10px 16px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#9a9488;text-align:left;}thead th:last-child{text-align:right;}.tr td{padding:14px 16px;font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;background:#f0ede8;border-top:2px solid #ddd8cc;}.tr td:last-child{text-align:right;color:#1a4a2a;font-size:16px;}.footer{text-align:center;padding:28px;font-size:10px;color:#9a9488;letter-spacing:.08em;}@media print{body{background:#fff;}.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style></head><body><div class="cover"><div class="cl">Expense Report</div><div class="ct">${title}</div><div class="cs">${label} · ${dateStr}</div><div class="meta"><div><div class="ml">Total spent</div><div class="mv">$${total.toFixed(2)}</div><div class="ms">${data.length} expenses</div></div><div><div class="ml">Categories</div><div class="mv">${sorted.length}</div><div class="ms">expense groups</div></div></div></div><div class="body"><table><thead><tr><th>Date</th><th>Store</th><th>Description</th><th>Card</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${rows}<tr class="tr"><td colspan="4">TOTAL</td><td>$${total.toFixed(2)}</td></tr></tbody></table></div><div style="text-align:center;padding:20px;"><button onclick="window.print()" style="font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:12px 24px;background:#1a1917;color:#b8976a;border:none;cursor:pointer;margin-right:8px;">🖨 Print / Save PDF</button><button onclick="window.close()" style="font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:12px 24px;background:#f5f2ec;color:#1c1a16;border:1px solid #ddd8cc;cursor:pointer;">✕ Close</button></div><div class="footer">COMMAND CENTER · REYNALD LAURENT · ${dateStr}</div></body></html>`;
  const win=window.open('','_blank');
  if(win){win.document.write(html);win.document.close();}
  else alert('Please allow popups to view the report.');
};

function getBillsDueThisMonth(month){
  const mi=month-1;
  const regular=REGULAR_BILLS.filter(b=>b.amounts[mi]!==undefined).map(b=>({...b,amount:b.amounts[mi],type:'regular'}));
  const yearly=YEARLY_BILLS.filter(b=>{
    if(b.btype==='multi-yearly') return b.multiMonths && b.multiMonths[month] !== undefined;
    return b.month===month;
  }).map(b=>{
    if(b.btype==='multi-yearly'){
      const mm=b.multiMonths[month];
      return {...b,amount:mm?mm.amount:null,day:mm?mm.day:b.day,type:'yearly'};
    }
    return {...b,type:'yearly'};
  });
  return [...regular,...yearly];
}

function isBillPaid(key,month,year){
  const k=key+'-'+year+'-'+month;
  return !!(billsPaid[k]&&billsPaid[k].paid);
}

async function toggleBillPaid(key,month,year,amount,name){
  const paidKey=key+'-'+year+'-'+month;
  const isPaid=isBillPaid(key,month,year);
  if(firebaseReady){
    if(isPaid){await deleteDoc(doc(db,'billspaid',paidKey));}
    else{await setDoc(doc(db,'billspaid',paidKey),{paid:true,name,amount,paidAt:Date.now()});}
  }else{
    if(isPaid)delete billsPaid[paidKey];
    else billsPaid[paidKey]={paid:true,name,amount,paidAt:Date.now()};
    renderBills();
  }
}
window.toggleBillPaid=toggleBillPaid;

      '<div style="font-size:18px;font-weight:700;color:#93c5fd;">$'+grpTotal.toFixed(2)+'</div>'+

      '</div></div>';
  }

  function subHdr(label,count,isPaid){
    return '<div style="padding:6px 14px;background:'+(isPaid?'var(--surface2)':'#fffbeb')+';border:1px solid '+(isPaid?'var(--border)':'#fcd34d')+';border-top:none;display:flex;align-items:center;gap:8px;">'+

      '</div>';
  }

  function billRow(b){
    const amtPaid=isAmountPaid(b);
    const effDay=b.effectiveDay||b.day;
    const isOverdue=!amtPaid&&billsMonth===todayMonth&&effDay<todayDay;
    const isCRC=b.currency==='CRC';
    const statusBadge=amtPaid
      ?'<span style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#e8f5e9;color:#1a4a2a;border:1px solid #a5d6a7;">\u2713 PAID</span>'
      :'<span style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:'+(isOverdue?'#fef2f2':'#fff8e1')+';color:'+(isOverdue?'#b91c1c':'#92400e')+';border:1px solid '+(isOverdue?'#fca5a5':'#fcd34d')+';">'+(isOverdue?'\u26a0 OVERDUE':'PENDING')+'</span>';

    }else if(isCRC){
      const usdEquiv=crcToUSD(parseFloat(b.amount));
      amtDisplay='<div style="text-align:right;"><div style="font-size:18px;font-weight:700;color:var(--text3);">\u20a1'+Math.round(parseFloat(b.amount)).toLocaleString()+'</div><div style="font-size:10px;color:var(--text3);">\u2248 $'+usdEquiv.toFixed(2)+'</div></div>';
      actionBtn='<button onclick="event.stopPropagation();clearBillAmount(\''+b.key+'\','+billsMonth+','+year+')" style="font-size:8px;font-weight:700;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;margin-top:4px;">\u2715 clear</button>';
    }else{
      amtDisplay='<div style="font-size:18px;font-weight:700;color:var(--text3);">$'+parseFloat(b.amount).toFixed(2)+'</div>';
      actionBtn='<button onclick="event.stopPropagation();clearBillAmount(\''+b.key+'\','+billsMonth+','+year+')" style="font-size:8px;font-weight:700;padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;margin-top:4px;">\u2715 clear</button>';
    }
    const autoBadge=b.auto!==undefined?'<span style="font-size:8px;font-weight:700;padding:2px 6px;border-radius:20px;background:'+(b.auto?'#e8f5e9':'#fff8e1')+';color:'+(b.auto?'#2e7d32':'#f57f17')+';border:1px solid '+(b.auto?'#a5d6a7':'#ffe082')+';">'+(b.auto?'AUTO':'MANUAL')+'</span>':'';

    const propBadge=billsGroupBy!=='property'?'<span style="font-size:8px;font-weight:600;padding:2px 6px;border-radius:20px;background:var(--blue-bg);color:var(--accent);border:1px solid var(--blue-border);">'+b.property+'</span>':'';
    const crcBadge=isCRC?'<span style="font-size:8px;font-weight:700;padding:2px 6px;border-radius:20px;background:#e8f5e9;color:#1a4a2a;border:1px solid #a5d6a7;">\u20a1 CRC</span>':'';
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:'+(amtPaid?'var(--surface2)':isOverdue?'#fff8f8':'#fff')+';border:1px solid '+(isOverdue&&!amtPaid?'#fca5a5':'var(--border)')+';border-top:none;opacity:'+(amtPaid?'.8':'1')+';">'+
      '<div style="flex:1;min-width:0;">'+

      '<div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">'+propBadge+autoBadge+cardBadge+dayEditWidget(b)+crcBadge+'</div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0;">'+amtDisplay+actionBtn+'</div>'+
      '</div>';
  }

  function renderGroup(bills){
    const pending=bills.filter(b=>!isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    const paid=bills.filter(b=>isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    let out='';
    if(pending.length){out+=subHdr('Pending',pending.length,false);out+=pending.map(billRow).join('');}
    if(paid.length){out+=subHdr('Paid',paid.length,true);out+=paid.map(billRow).join('');}
    return out;
  }

  if(allBills.length===0){html+='<div class="empty">No bills match your filters.</div>';}
  else if(billsGroupBy==='property'){
    const byProp={};

    const propOrder=['Hampton','Pembroke Pines','Lithonia','McDonough','Nila','Ciudad Colon','Haiti','Personal'];
    const ordered=[...propOrder.filter(p=>byProp[p]),...Object.keys(byProp).filter(p=>!propOrder.includes(p))];
    ordered.forEach(prop=>{html+=grpHdr(prop,byProp[prop]);html+=renderGroup(byProp[prop]);});
  }else{
    const byDay={};
    allBills.forEach(b=>{const d=b.effectiveDay||b.day||0;if(!byDay[d])byDay[d]=[];byDay[d].push(b);});
    Object.keys(byDay).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(day=>{

      html+=grpHdr(parseInt(day)>0?'Day '+day+' of '+MONTH_NAMES[billsMonth-1]:'No due day set',bills);
      html+=renderGroup(bills);
    });
  }

  document.getElementById('task-area').innerHTML=html;
  const inp=document.getElementById('bills-search-inp');
  if(inp&&billsSearch){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
};

    "  if(!h)h='<tr><td colspan=\"14\" style=\"padding:16px;text-align:center;color:#6b7280;\">No bills match.</td></tr>';",
    "  document.getElementById('tb').innerHTML=h;",
    "  document.getElementById('matrix-view').style.display='block';",
    "  document.getElementById('calendar-view').style.display='none';}",
    "function renderCalendar(){",
    "  var f=filtered();",
    "  var MNF=['" + MN_FULL.join("','") + "'];",
    "  var h='<div class=\"cal-grid\">';",
    "  for(var m=1;m<=12;m++){",
    "    var isCur=m===CM;var isFut=m>CM;",
    "    var mBills=f.filter(function(b){var a=b.months[m];return a!==undefined;});",
    "    var mTot=mBills.reduce(function(s,b){return s+bu(b,b.months[m]);},0);",
    "    h+='<div class=\"cal-month'+(isCur?' cur-mo':'')+'\"><div class=\"cal-month-hdr\">';",
    "    h+='<span class=\"cal-month-name\">'+MNF[m-1]+(isCur?' \u25c4':isFut?' \u00b7':' \u2713')+'</span>';",
    "    h+='<span class=\"cal-month-tot\">$'+mTot.toFixed(0)+'</span></div>';",
    "    if(mBills.length===0){h+='<div class=\"cal-empty\">No bills due</div>';}",
    "    else{mBills.sort(function(a,b){",
    "      var da=parseInt((a.dueLabel||'').replace(/[^0-9]/g,''))||99;",
    "      var db=parseInt((b.dueLabel||'').replace(/[^0-9]/g,''))||99;",
    "      return da-db;});",
    "    mBills.forEach(function(b){",
    "      var a=b.months[m];",
    "      var amtStr=fmtAmt(b,a);",
    "      var isPaid=a!==null&&a!==undefined;",
    "      var isPend=!isPaid&&!isFut;",
    "      var amtCls=isPaid?'cal-paid':isPend?'cal-pend':'cal-tbd';",
    "      var amtDisp=amtStr||(isPend?'PENDING':'');",
    "      var isAnn=b.btype!=='regular';",
    "      var tb=isAnn?'<span class=\"by\">A</span>':'';",
    "      h+='<div class=\"cal-item\"><div><div class=\"cal-item-name\">'+b.short+tb+'</div>';",
    "      if(b.card)h+='<div class=\"cal-item-day\">'+b.card+'</div>';",
    "      h+='</div><div class=\"cal-item-amt '+amtCls+'\">'+amtDisp+'</div></div>';});}",
    "    h+='</div>';}",
    "  h+='</div>';",
    "  document.getElementById('calendar-view').innerHTML=h;",
    "  document.getElementById('calendar-view').style.display='block';",
    "  document.getElementById('matrix-view').style.display='none';}",
    "function setView(v){",
    "  VIEW=v;",
    "  document.getElementById('vbtn-cal').className='vbtn'+(v==='calendar'?' active':'');",
    "  document.getElementById('vbtn-mat').className='vbtn'+(v==='matrix'?' active':'');",
    "  go();}",
    "function go(){if(VIEW==='calendar')renderCalendar();else renderMatrix();}",
    "go();"
  ].join("\n");

  p.push("<button class=\"fbtn\" onclick=\"document.getElementById('fp').value='';document.getElementById('fi').value='';document.getElementById('ft').value='';go();\">&#10005; Clear</button>");
  p.push("<div class=\"rate\">$1=&#8353;" + Math.round(usdCRC).toLocaleString() + " CRC</div>");
  p.push("</div>");

  // Content areas
  p.push("<div class=\"body\">");

  p.push("</table></div></div>");
  p.push("</div>");

  // Actions
  p.push("<div class=\"act\">");

  // Client script
  p.push("<scr" + "ipt>" + clientJs + "</scr" + "ipt>");
  p.push("</body></html>");

  var html = p.join("");
  var win = window.open("", "_blank");
  if (win) { win.document.write(html); win.document.close(); }
  else alert("Please allow popups to view the report.");
};
