<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — Reynald</title>
<link href="https://fonts.bunny.net/css?family=cormorant-garamond:300,400,500,600|montserrat:300,400,500,600,700|dm-mono:400,500" rel="stylesheet">
<style>
:root{--ink:#0d0c0a;--ink2:#1c1a16;--ink3:#2a2720;--surface:#f5f2ec;--surface2:#eeebe3;--gold:#b8976a;--gold2:#d4b483;--text:#1c1a16;--text2:#5a5649;--text3:#9a9488;--border:#ddd8cc;--border2:#c8c2b4;--red:#8b2020;--green:#1a4a2a;--green-bg:#f0f8f2;--blue:#1a3a5c;--blue-bg:#e8f0fe;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;}
#pin-screen{display:none;position:fixed;inset:0;background:var(--ink);z-index:1000;align-items:center;justify-content:center;flex-direction:column;}
.pin-box{background:var(--ink2);border:1px solid rgba(184,151,106,.2);border-radius:2px;padding:52px 48px;width:90%;max-width:380px;text-align:center;}
.pin-logo{font-family:'Cormorant Garamond',serif;font-size:11px;font-weight:500;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.pin-sub{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:36px;}
.pin-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:10px;}
#pin-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(184,151,106,.25);border-radius:1px;color:var(--gold2);font-family:'DM Mono',monospace;font-size:28px;letter-spacing:.4em;text-align:center;padding:14px;outline:none;margin-bottom:16px;}
#pin-input:focus{border-color:var(--gold);}
.pin-btn{width:100%;background:var(--gold);color:var(--ink);border:none;border-radius:1px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:14px;cursor:pointer;}
#pin-error{display:none;font-size:11px;color:#e07070;margin-top:12px;}
#app{display:none;}
#loading{display:none;position:fixed;inset:0;background:var(--surface);z-index:900;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
#offline-banner{display:none;background:#fffbeb;border-bottom:1px solid #fcd34d;padding:8px 24px;font-size:11px;color:#92400e;}
.top-bar{background:var(--ink);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(184,151,106,.15);}
.top-left{display:flex;align-items:center;gap:14px;}
.app-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);}
.top-date{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.25);}
.lock-btn{background:none;border:1px solid rgba(184,151,106,.3);border-radius:1px;color:var(--gold);font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:6px 12px;cursor:pointer;}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--gold);font-size:20px;}
.summary-bar{background:var(--ink2);border-bottom:1px solid rgba(184,151,106,.12);padding:0 24px;height:68px;display:flex;align-items:center;gap:32px;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;line-height:1;}
.stat-num.red{color:#e07070;}.stat-num.amber{color:var(--gold2);}.stat-num.green{color:#70c090;}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.3);margin-top:2px;font-weight:600;}
.s-div{width:1px;height:28px;background:rgba(255,255,255,.08);}
.layout{display:flex;min-height:calc(100vh - 126px);}
.sidebar{width:215px;min-width:215px;background:var(--ink2);border-right:1px solid rgba(184,151,106,.1);padding:20px 0;position:sticky;top:126px;height:calc(100vh - 126px);overflow-y:auto;}
.sb-group{font-family:'Cormorant Garamond',serif;font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.7;padding:14px 22px 6px;}
.sb-item{display:flex;align-items:center;justify-content:space-between;padding:9px 22px;cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.35);border-left:2px solid transparent;transition:all .15s;}
.sb-item:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);}
.sb-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(184,151,106,.06);}
.sb-count{font-family:'DM Mono',monospace;font-size:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:1px 7px;color:rgba(255,255,255,.3);}
.sb-item.active .sb-count{background:rgba(184,151,106,.15);border-color:rgba(184,151,106,.3);color:var(--gold);}
.sb-back{display:flex;align-items:center;gap:6px;padding:10px 22px 14px;cursor:pointer;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:.6;border-bottom:1px solid rgba(184,151,106,.1);margin-bottom:8px;}
.sb-back:hover{opacity:1;}
.main{flex:1;padding:28px 32px 80px;max-width:900px;}
.btn{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:10px 18px;border-radius:1px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-dark{background:var(--ink);color:var(--gold);}
.btn-green{background:#1a3d2a;color:#70c090;}
.btn-blue{background:var(--blue);color:#a0c0e0;}
.btn-cancel{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;border-radius:1px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;}
.btn-save{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 20px;border-radius:1px;border:none;background:var(--ink);color:var(--gold);cursor:pointer;}
.btn-del{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:1px;border:1px solid #e8c0c0;background:#fdf0f0;color:var(--red);cursor:pointer;margin-right:auto;}
.add-bar{background:#fff;border:1px solid var(--border);border-radius:2px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:24px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:border-color .15s;}
.add-bar:hover{border-color:var(--gold);}
.add-icon{width:28px;height:28px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:18px;}
.add-ph{font-size:12px;color:var(--text3);}
.task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 15px;background:#fff;border:1px solid var(--border);border-top:none;cursor:pointer;transition:background .12s,border-color .12s;}
.task-row:hover{background:#fdfbf8;border-color:var(--gold);}
.task-row.done-row{background:var(--surface2);}
.task-row-first{border-top:1px solid var(--border)!important;}
.task-row:last-child{border-radius:0 0 2px 2px;margin-bottom:10px;}
.check{width:16px;height:16px;min-width:16px;border-radius:50%;border:1.5px solid var(--border2);margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.check:hover{border-color:var(--gold);}
.check.checked{background:var(--ink);border-color:var(--ink);}
.check.checked::after{content:'✓';font-size:9px;color:var(--gold);font-weight:700;}
.task-body{flex:1;min-width:0;}
.task-text{font-size:13px;line-height:1.5;color:var(--text);}
.task-text.struck{text-decoration:line-through;color:var(--text3);}
.task-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center;}
.tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
.t-urgent{background:#fdf0f0;color:var(--red);border:1px solid #e8c0c0;}
.t-pending{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.task-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);font-weight:500;}
.bucket-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-radius:2px 2px 0 0;margin-bottom:1px;}
.bucket-lbl{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.bucket-cnt{font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--ink);border-radius:2px;margin:8px 0 3px;}
.cat-hdr-lbl{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
.cat-hdr-cnt{font-family:'DM Mono',monospace;font-size:9px;background:rgba(184,151,106,.15);border-radius:20px;padding:1px 7px;color:rgba(184,151,106,.7);}
.sec{margin-bottom:24px;}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sec-title{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);white-space:nowrap;}
.sec-line{flex:1;height:1px;background:var(--border);}
.sec-cnt{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
.empty{color:var(--text3);font-size:13px;padding:28px 0;text-align:center;}
.home-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:28px;}
.home-card{background:#fff;border:1px solid var(--border);border-radius:2px;padding:28px 24px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.home-card:hover{border-color:var(--gold);box-shadow:0 2px 20px rgba(184,151,106,.12);}
.home-card-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);margin-bottom:8px;}
.home-card-num{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--text);line-height:1;margin-bottom:6px;}
.home-card-sub{font-size:10px;color:var(--text3);}
.exp-card{background:#fff;border:1px solid var(--border);border-radius:2px;padding:15px 17px;margin-bottom:5px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.exp-card:hover{border-color:var(--gold);box-shadow:0 2px 12px rgba(184,151,106,.1);}
.exp-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.exp-store{font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;color:var(--text);}
.exp-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.exp-amt{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--green);white-space:nowrap;}
.exp-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.exp-pill{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.exp-del{margin-left:auto;background:none;border:none;color:var(--border2);cursor:pointer;font-size:12px;padding:2px 5px;}
.exp-del:hover{color:var(--red);}
.exp-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.exp-total-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);margin-bottom:4px;}
.exp-total-num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:var(--text);line-height:1;}
.exp-total-sub{font-size:10px;color:var(--text3);margin-top:4px;}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-sel{font-family:'Montserrat',sans-serif;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:1px;padding:9px 14px;outline:none;cursor:pointer;}
.filter-sel:focus{border-color:var(--gold);}
.filter-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);white-space:nowrap;}
.filter-clear{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:1px;border:1px solid #e8c0c0;background:#fdf0f0;color:var(--red);cursor:pointer;}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.exp-form{background:var(--surface2);border:1px solid var(--border);border-radius:2px;padding:20px;margin-top:16px;}
.exp-form-title{font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(13,12,10,.7);z-index:400;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:2px;width:92%;max-width:440px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.2);border-top:3px solid var(--gold);max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);margin-bottom:22px;}
.field{margin-bottom:14px;}
.field-lbl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:5px;}
.field-inp{width:100%;font-family:'Montserrat',sans-serif;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:1px;padding:9px 13px;outline:none;transition:border-color .15s;}
.field-inp:focus{border-color:var(--gold);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;align-items:center;}
.done-btn{width:100%;font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:10px;border-radius:1px;border:1.5px solid #a0c8a8;background:var(--green-bg);color:var(--green);cursor:pointer;margin-top:12px;}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:270px;background:var(--ink2);z-index:201;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:24px 0;border-right:1px solid rgba(184,151,106,.15);}
.drawer.open{transform:translateX(0);}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 22px 18px;border-bottom:1px solid rgba(184,151,106,.1);margin-bottom:10px;}
.drawer-title{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
.drawer-close{background:none;border:none;cursor:pointer;font-size:16px;color:rgba(255,255,255,.3);}
@media(max-width:640px){
  .sidebar{display:none;}.hamburger{display:block;}
  .main{padding:18px 16px 80px;}.top-bar{padding:0 16px;height:54px;}
  .summary-bar{padding:0 16px;gap:20px;height:62px;}
  .home-grid{grid-template-columns:1fr;}.home-card-num{font-size:32px;}
  .exp-total-num{font-size:30px;}
}
</style>
</head>
<body>

<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">Command Center</div>
    <div class="pin-sub">Personal Operations</div>
    <div class="pin-label">Enter your PIN</div>
    <input type="password" id="pin-input" maxlength="8" inputmode="numeric" placeholder="••••">
    <button class="pin-btn" onclick="submitPin()">Unlock</button>
    <div id="pin-error">Incorrect PIN. Try again.</div>
  </div>
</div>

<div id="app">
  <div id="loading"><div class="spinner"></div><div class="loading-text">Connecting...</div></div>
  <div id="offline-banner">⚠️ Offline mode — changes saved on this device only.</div>

  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-hdr">
      <span class="drawer-title">Navigation</span>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div id="drawer-nav"></div>
  </div>

  <!-- TASK EDIT -->
  <div class="overlay" id="task-modal">
    <div class="modal">
      <div class="modal-title">Edit task</div>
      <div class="field"><label class="field-lbl">Task</label><textarea class="field-inp" id="tm-text" rows="3" style="resize:none;"></textarea></div>
      <div class="field"><label class="field-lbl">Category</label>
        <select class="field-inp" id="tm-cat">
          <option value="vehicles">Vehicles / logistics</option><option value="nila">Nación Nila</option>
          <option value="florida">Florida move</option><option value="property">Property</option>
          <option value="legal">Legal / divorce</option><option value="personal">Personal</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Priority</label>
        <select class="field-inp" id="tm-tag"><option value="pending">Pending</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="field"><label class="field-lbl">Due date</label><input class="field-inp" id="tm-date" type="date"></div>
      <div class="modal-actions">
        <button class="btn-del" onclick="deleteTask()">Delete</button>
        <button class="btn-cancel" onclick="closeTaskModal()">Cancel</button>
        <button class="btn-save" onclick="saveTask()">Save</button>
      </div>
      <button class="done-btn" onclick="markDone()">✓ Mark as complete</button>
    </div>
  </div>

  <!-- ADD TASK -->
  <div class="overlay" id="add-task-modal">
    <div class="modal">
      <div class="modal-title">New task</div>
      <div class="field"><label class="field-lbl">Description</label><textarea class="field-inp" id="at-text" rows="3" style="resize:none;" placeholder="What needs to be done?"></textarea></div>
      <div class="field"><label class="field-lbl">Category</label>
        <select class="field-inp" id="at-cat">
          <option value="personal">Personal</option><option value="vehicles">Vehicles / logistics</option>
          <option value="nila">Nación Nila</option><option value="florida">Florida move</option>
          <option value="property">Property</option><option value="legal">Legal / divorce</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Priority</label>
        <select class="field-inp" id="at-tag"><option value="pending">Pending</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="field"><label class="field-lbl">Due date (optional)</label><input class="field-inp" id="at-date" type="date"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddTask()">Cancel</button>
        <button class="btn-save" onclick="submitTask()">Add task</button>
      </div>
    </div>
  </div>

  <!-- EXPENSE EDIT -->
  <div class="overlay" id="exp-modal">
    <div class="modal">
      <div class="modal-title">Edit expense</div>
      <div class="field"><label class="field-lbl">Store / Vendor</label><input class="field-inp" id="em-store" type="text"></div>
      <div class="field"><label class="field-lbl">Item / Description</label><input class="field-inp" id="em-item" type="text"></div>
      <div class="field"><label class="field-lbl">Amount ($)</label><input class="field-inp" id="em-amount" type="number" step="0.01"></div>
      <div class="field"><label class="field-lbl">Payment card</label>
        <select class="field-inp" id="em-card">
          <option>Truist Debit</option><option>American Express</option><option>Chase Mastercard</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Category</label>
        <select class="field-inp" id="em-cat">
          <option>Furniture</option><option>Electronics</option><option>Food & Grocery</option>
          <option>Transportation</option><option>Home Supplies</option><option>Clothing</option>
          <option>Gas</option><option>Hotel/Lodging</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label class="field-lbl">Date</label><input class="field-inp" id="em-date" type="date"></div>
      <div class="field"><label class="field-lbl">Location</label><input class="field-inp" id="em-location" type="text"></div>
      <div class="modal-actions">
        <button class="btn-del" onclick="deleteExpense()">Delete</button>
        <button class="btn-cancel" onclick="closeExpModal()">Cancel</button>
        <button class="btn-save" onclick="saveExpense()">Save</button>
      </div>
    </div>
  </div>

  <div class="top-bar">
    <div class="top-left">
      <button class="hamburger" onclick="openDrawer()">☰</button>
      <span class="app-title">Command Center</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="top-date" id="top-date"></span>
      <button class="lock-btn" onclick="lockApp()">🔒 Lock</button>
    </div>
  </div>

  <div class="summary-bar">

function parseDate(s){
  if(!s)return null;
  const sl=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);
  if(sl)return new Date(sl[3]||new Date().getFullYear(),parseInt(sl[1])-1,parseInt(sl[2]));
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso)return new Date(parseInt(iso[1]),parseInt(iso[2])-1,parseInt(iso[3]));
  const p=s.trim().toLowerCase().split(/\s+/);
  if(p.length>=2){const m=MONTHS[p[0].substring(0,3)];const d=parseInt(p[1]);if(m!==undefined&&!isNaN(d))return new Date(new Date().getFullYear(),m,d);}
  return null;
}
function dateBucket(s){
  const d=parseDate(s);if(!d)return'nodate';
  const t=new Date();t.setHours(0,0,0,0);
  const diff=Math.floor((d-t)/86400000);
  if(diff<0)return'overdue';if(diff===0)return'today';if(diff<=7)return'thisweek';return'upcoming';
}
function todayISO2(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().split('T')[0];}
function getFiltered(data){
  return data.filter(e=>{
    if(expCatFilter&&(e.category||'')!==expCatFilter)return false;
    if(expMonthFilter&&e.date){const[fy,fm]=expMonthFilter.split('-');const[ey,em]=(e.date||'').split('-');if(ey!==fy||em!==fm)return false;}
    return true;
  });
}
function dateToISO(s){const d=parseDate(s);if(!d)return'';return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split('T')[0];}
function isoToDisplay(raw){if(!raw)return'';const[y,m,d]=raw.split('-');return MN[parseInt(m)-1]+' '+parseInt(d);}

window.exportExcel=function(){
  const data=getFiltered(getArr());
  const label=activeExpSec==='lithonia'?'Lithonia':'Florida';
  if(!data.length){alert('No expenses to export.');return;}
  const h=['Date','Store','Description','Amount','Category','Card','Location'];
  const rows=[...data].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).map(e=>[e.date||'',e.store||'',e.item||'',parseFloat(e.amount||0).toFixed(2),e.category||'',e.card||'',e.location||'']);
  rows.push(['','','TOTAL',data.reduce((s,e)=>s+(parseFloat(e.amount)||0),0).toFixed(2),'','','']);
  const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=label+'_Expenses_'+todayISO()+'.csv';a.click();
  URL.revokeObjectURL(url);
};

window.generateReport=function(){
  const data=getFiltered(getArr());

gories</div><div class="mv">${sorted.length}</div><div class="ms">expense groups</div></div></div></div><div class="body"><table><thead><tr><th>Date</th><th>Store</th><th>Description</th><th>Card</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${rows}<tr class="tr"><td colspan="4">TOTAL</td><td>$${total.toFixed(2)}</td></tr></tbody></table></div><div style="text-align:center;padding:20px;"><button onclick="window.print()" style="font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:12px 24px;background:#1a1917;color:#b8976a;border:none;cursor:pointer;margin-right:8px;">🖨 Print / Save PDF</button><button onclick="window.close()" style="font-family:Montserrat,sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:12px 24px;background:#f5f2ec;color:#1c1a16;border:1px solid #ddd8cc;cursor:pointer;">✕ Close</button></div><div class="footer">COMMAND CENTER · REYNALD LAURENT · ${dateStr}</div></body></html>`;

function getBillsDueThisMonth(month){
  const mi=month-1;
  const regular=REGULAR_BILLS.filter(b=>b.amounts[mi]!==undefined).map(b=>({...b,amount:b.amounts[mi],type:'regular'}));
  const yearly=YEARLY_BILLS.filter(b=>b.month===month).map(b=>({...b,type:'yearly'}));
  return [...regular,...yearly];
}

function isBillPaid(key,month,year){
  const k=key+'-'+year+'-'+month;
  return !!(billsPaid[k]&&billsPaid[k].paid);
}

async function toggleBillPaid(key,month,year,amount,name){
  const paidKey=key+'-'+year+'-'+month;
  const isPaid=isBillPaid(key,month,year);
  if(firebaseReady){
    if(isPaid){await deleteDoc(doc(db,'billspaid',paidKey));}
    else{await setDoc(doc(db,'billspaid',paidKey),{paid:true,name,amount,paidAt:Date.now()});}
  }else{
    if(isPaid)delete billsPaid[paidKey];
    else billsPaid[paidKey]={paid:true,name,amount,paidAt:Date.now()};
    renderBills();
  }
}
window.toggleBillPaid=toggleBillPaid;

window.renderBills=function renderBills(){
  const year=new Date().getFullYear();
  const today=new Date();
  const todayDay=today.getDate();
  const todayMonth=today.getMonth()+1;

  // Merge all bills for this month with effective day overrides
  let allBills=[
    ...REGULAR_BILLS.map(b=>({...b,amount:b.amounts[billsMonth-1],btype:'regular'})).filter(b=>b.amount!==undefined),
    ...YEARLY_BILLS.filter(b=>b.month===billsMonth).map(b=>({...b,btype:'yearly'}))
  ].map(b=>({...b,effectiveDay:billDayOverrides[b.key]!==undefined?billDayOverrides[b.key]:b.day}));

  if(billsPropFilter){allBills=allBills.filter(b=>b.property===billsPropFilter);}
  if(billsSearch){
    const q=billsSearch.toLowerCase();
    allBills=allBills.filter(b=>b.short.toLowerCase().includes(q)||b.property.toLowerCase().includes(q)||(b.card||'').toLowerCase().includes(q));
  }

  function billUSD(b){
    if(b.amount===null||b.amount===undefined)return 0;
    return b.currency==='CRC'?crcToUSD(parseFloat(b.amount)):parseFloat(b.amount)||0;
  }
  const paidBills=allBills.filter(b=>isAmountPaid(b));
  const pendingBills=allBills.filter(b=>!isAmountPaid(b));
  const totalDue=allBills.reduce((s,b)=>s+billUSD(b),0);
  const totalPaid=paidBills.reduce((s,b)=>s+billUSD(b),0);
  const totalRemaining=pendingBills.length; // count of pending items

  function dayEditWidget(b){
    const d=b.effectiveDay||b.day||'?';
    return `<span onclick="event.stopPropagation();showDayEdit('${b.key}',${d})"
      style="font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);cursor:pointer;text-decoration:underline dotted;padding:1px 4px;border-radius:3px;"
      title="Click to change due day">Day ${d} ✎</span>`;
  }

  // amount present (not null/undefined) = PAID; null/undefined = PENDING
  function isAmountPaid(b){ return b.amount!==null&&b.amount!==undefined; }

  function billRow(b){
    const amtPaid=isAmountPaid(b);
    const effDay=b.effectiveDay||b.day;
    const isOverdue=!amtPaid&&billsMonth===todayMonth&&effDay<todayDay;
    const isCRC=b.currency==='CRC';
    // Status badge
    const statusBadge=amtPaid
      ? `<span style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#e8f5e9;color:#1a4a2a;border:1px solid #a5d6a7;">✓ PAID</span>`
      : `<span style="font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:${isOverdue?'#fef2f2':'#fff8e1'};color:${isOverdue?'#b91c1c':'#92400e'};border:1px solid ${isOverdue?'#fca5a5':'#fcd34d'};">${isOverdue?'⚠ OVERDUE':'PENDING'}</span>`;
    let amt;
    if(!amtPaid){
      amt='<span style="color:var(--text3);font-size:12px;font-style:italic;">No amount</span>';
    }else if(isCRC){
      const usdEquiv=crcToUSD(parseFloat(b.amount));
      amt=`<div style="text-align:right;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text3);">&#8353;${Math.round(parseFloat(b.amount)).toLocaleString()}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:1px;">&#8776; $${usdEquiv.toFixed(2)}</div>
      </div>`;
    }else{
      amt=`<div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text3);">$${parseFloat(b.amount).toFixed(2)}</div>`;
    }
    const autoBadge=b.auto!==undefined?`<span style="font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:20px;background:${b.auto?'#e8f5e9':'#fff8e1'};color:${b.auto?'#2e7d32':'#f57f17'};border:1px solid ${b.auto?'#a5d6a7':'#ffe082'};">${b.auto?'AUTO':'MANUAL'}</span>`:'';
    const cardBadge=b.card?`<span style="font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);">${b.card}</span>`:'';
    const propBadge=billsGroupBy!=='property'?`<span style="font-size:8px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:20px;background:#e8f0fe;color:#1a3a5c;border:1px solid #c0d4e8;">${b.property}</span>`:'';
    const crcBadge=isCRC?'<span style="font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:20px;background:#e8f5e9;color:#1a4a2a;border:1px solid #a5d6a7;">&#8353; CRC</span>':'';
    return`<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:${amtPaid?'var(--surface2)':isOverdue?'#fff8f8':'#fff'};border:1px solid ${isOverdue&&!amtPaid?'#fca5a5':'var(--border)'};border-top:none;transition:background .12s;opacity:${amtPaid?'.75':'1'};">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          ${statusBadge}
          <span style="font-size:13px;font-weight:${amtPaid?'400':'600'};color:${amtPaid?'var(--text3)':'var(--text)'};text-decoration:${amtPaid?'line-through':'none'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.short}</span>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;">${propBadge}${autoBadge}${cardBadge}${dayEditWidget(b)}${crcBadge}</div>
      </div>
      <div style="white-space:nowrap;text-align:right;">${amt}</div>
    </div>`;
  }

  function grpHdr(label,bills){
    const grpTotal=bills.reduce((s,b)=>s+billUSD(b),0);
    const grpPaidCount=bills.filter(b=>isAmountPaid(b)).length;
    const grpPendingCount=bills.filter(b=>!isAmountPaid(b)).length;
    return`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--ink);border-radius:2px 2px 0 0;margin-top:20px;margin-bottom:1px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);">${label}</span>
        <span style="font-family:'DM Mono',monospace;font-size:10px;background:rgba(184,151,106,.15);border-radius:20px;padding:1px 8px;color:rgba(184,151,106,.7);">${bills.length}</span>
      </div>
      <div style="text-align:right;">
        <div style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--gold2);">$${grpTotal.toFixed(2)}</div>
        <div style="font-size:9px;color:rgba(255,255,255,.3);margin-top:1px;">${grpPaidCount} paid · ${grpPendingCount} pending</div>
      </div>
    </div>`;
  }

  // ── summary header ────────────────────────────────────────
  let html=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);margin-bottom:4px;">Bill Tracker · ${MONTH_NAMES[billsMonth-1]} ${year}</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:var(--text);line-height:1;">$${totalDue.toFixed(2)}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:4px;">$${totalPaid.toFixed(2)} confirmed paid · <strong style="color:${pendingBills.length>0?'var(--red)':'var(--green)'};">${pendingBills.length} pending</strong></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;background:#f0f8f2;border:1px solid #a5d6a7;border-radius:2px;padding:8px 14px;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-family:'DM Mono',monospace;font-size:10px;color:#1a4a2a;">&#127758; Exchange rate:</span>
      <span style="font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#1a4a2a;">$1 USD = &#8353;${Math.round(usdCRC).toLocaleString()} CRC</span>
      <button onclick="fetchExchangeRate().then(()=>renderBills())"
        style="font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:1px;border:1px solid #a5d6a7;background:transparent;color:#1a4a2a;cursor:pointer;">&#8635; Refresh</button>
      <span style="font-size:10px;color:var(--text3);margin-left:auto;">${usdCRCLastFetched?'Updated '+new Date(usdCRCLastFetched).toLocaleTimeString():'Using fallback rate'}</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">
      <select class="filter-sel" onchange="window.billsMonth=parseInt(this.value);window.billsPropFilter='';window.renderBills();window.renderSidebar();">
        ${MONTH_NAMES.map((m,i)=>`<option value="${i+1}"${billsMonth===i+1?' selected':''}>${m}</option>`).join('')}
      </select>
      <input id="bills-search-inp" type="text" class="filter-sel" placeholder="Search bill or property..." value="${billsSearch.replace(/"/g,'&quot;')}"
        oninput="window.billsSearch=this.value;window.renderBills()" style="min-width:180px;">
      <span style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);">Group by</span>
      <button onclick="window.billsGroupBy='day';window.renderBills()"
        style="font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:1px;border:1px solid ${billsGroupBy==='day'?'var(--gold)':'var(--border)'};background:${billsGroupBy==='day'?'var(--ink)':'transparent'};color:${billsGroupBy==='day'?'var(--gold)':'var(--text2)'};cursor:pointer;">
        Day
      </button>
      <button onclick="window.billsGroupBy='property';window.renderBills()"
        style="font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:1px;border:1px solid ${billsGroupBy==='property'?'var(--gold)':'var(--border)'};background:${billsGroupBy==='property'?'var(--ink)':'transparent'};color:${billsGroupBy==='property'?'var(--gold)':'var(--text2)'};cursor:pointer;">
        Property
      </button>
      ${(billsPropFilter||billsSearch)?`<button class="filter-clear" onclick="window.billsPropFilter='';window.billsSearch='';window.renderBills();window.renderSidebar();">&#10005; Clear</button>`:''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;">
      <div style="background:#fff;border:1px solid var(--border);border-radius:2px;padding:16px;">
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:6px;">Total bills</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:var(--text);">${allBills.length}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;">$${totalDue.toFixed(0)} USD equiv</div>
      </div>
      <div style="background:#fff;border:1px solid #a5d6a7;border-radius:2px;padding:16px;">
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#1a4a2a;margin-bottom:6px;">✓ Paid (amount set)</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:#1a4a2a;">${paidBills.length}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;">$${totalPaid.toFixed(0)} confirmed</div>
      </div>
      <div style="background:#fff;border:1px solid ${pendingBills.length>0?'#fca5a5':'var(--border)'};border-radius:2px;padding:16px;">
        <div style="font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:${pendingBills.length>0?'#b91c1c':'var(--text3)'};margin-bottom:6px;">Pending</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:${pendingBills.length>0?'var(--red)':'var(--green)'};">${pendingBills.length}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;">no amount recorded</div>
      </div>
    </div>`;

  function sortGroup(bills){
    // Pending (no amount) first sorted by day, then Paid sorted by day
    const pending=bills.filter(b=>!isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    const paid=bills.filter(b=>isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    return [...pending,...paid];
  }

  function subHdr(label,count,isPaid){
    return`<div style="padding:6px 14px;background:${isPaid?'var(--surface2)':'#fffbeb'};border:1px solid ${isPaid?'var(--border)':'#fcd34d'};border-top:none;display:flex;align-items:center;gap:8px;">
      <span style="font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:${isPaid?'var(--text3)':'#92400e'};">${label}</span>
      <span style="font-family:'DM Mono',monospace;font-size:9px;background:${isPaid?'var(--border)':'#fcd34d'};border-radius:20px;padding:1px 7px;color:${isPaid?'var(--text2)':'#92400e'};">${count}</span>
    </div>`;
  }

  function renderGroup(bills){
    const pending=bills.filter(b=>!isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    const paid=bills.filter(b=>isAmountPaid(b)).sort((a,b)=>a.effectiveDay-b.effectiveDay);
    let out='';
    if(pending.length){out+=subHdr('Pending',pending.length,false);out+=pending.map(billRow).join('');}
    if(paid.length){out+=subHdr('Paid',paid.length,true);out+=paid.map(billRow).join('');}
    return out;
  }

  if(allBills.length===0){
    html+='<div class="empty">No bills match your filters.</div>';
  }else if(billsGroupBy==='property'){
    const byProp={};
    allBills.forEach(b=>{if(!byProp[b.property])byProp[b.property]=[];byProp[b.property].push(b);});
    const propOrder=['Hampton','Pembroke Pines','Lithonia','McDonough','Nila','Ciudad Colon','Haiti','Personal'];
    const ordered=[...propOrder.filter(p=>byProp[p]),...Object.keys(byProp).filter(p=>!propOrder.includes(p))];
    ordered.forEach(prop=>{
      html+=grpHdr(prop,byProp[prop]);
      html+=renderGroup(byProp[prop]);
    });
  }else{
    // Group by day
    const byDay={};
    allBills.forEach(b=>{
      const d=b.effectiveDay||b.day||0;
      if(!byDay[d])byDay[d]=[];byDay[d].push(b);
    });
    Object.keys(byDay).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(day=>{
      const bills=byDay[day];
      const label=parseInt(day)>0?`Day ${day} of ${MONTH_NAMES[billsMonth-1]}`:'No due day set';
      html+=grpHdr(label,bills);
      html+=renderGroup(bills);
    });
  }

  document.getElementById('task-area').innerHTML=html;
  // Re-focus search box if it was being used (preserve cursor)
  const inp=document.getElementById('bills-search-inp');
  if(inp&&billsSearch){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
};
