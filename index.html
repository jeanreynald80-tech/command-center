  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

  function parseTaskDate(dateStr) {
    if (!dateStr) return null;
    const s = dateStr.trim();
    // Handle M/D or M/D/YYYY format
    const slashMatch = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);
    if (slashMatch) {
      const month = parseInt(slashMatch[1]) - 1;
      const day = parseInt(slashMatch[2]);
      const year = slashMatch[3] ? parseInt(slashMatch[3]) : new Date().getFullYear();
      return new Date(year, month, day);
    }
    // Handle YYYY-MM-DD format
    const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoMatch) {
      return new Date(parseInt(isoMatch[1]), parseInt(isoMatch[2])-1, parseInt(isoMatch[3]));
    }
    // Handle "May 11" or "May 11 2026" format
    const parts = s.toLowerCase().split(/\s+/);
    if (parts.length >= 2) {
      const month = MONTHS[parts[0].substring(0,3)];
      const day = parseInt(parts[1]);
      if (month !== undefined && !isNaN(day)) {
        const year = parts[2] ? parseInt(parts[2]) : new Date().getFullYear();
        return new Date(year, month, day);
      }
    }
    return null;
  }

  function getDateBucket(dateStr) {
    const d = parseTaskDate(dateStr);
    if (!d) return 'nodate';
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.floor((d - today) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= 7) return 'thisweek';
    return 'upcoming';
  }

  function countFor(catId) {
    if (catId === 'all') return tasks.filter(t=>!t.done).length;
    if (catId === 'urgent') return tasks.filter(t=>!t.done && t.tag==='urgent').length;
    if (catId === 'bydate') return tasks.filter(t=>!t.done && t.date).length;
    if (catId === 'expenses') return expenses.filter ? expenses.length : parseInt(localStorage.getItem('rey_exp_count') || '0');
    if (catId === 'lithonia') return lithoniaExpenses ? lithoniaExpenses.length : 0;
    return tasks.filter(t=>!t.done && t.cat===catId).length;
  }

  function renderByDate() {
    const open = tasks.filter(t => !t.done);
    const buckets = [
      { id:'overdue',  label:'Overdue',   color:'#b91c1c', bg:'#fef2f2', border:'#fca5a5', dot:'&#128308;' },
      { id:'today',    label:'Today',     color:'#92400e', bg:'#fffbeb', border:'#fcd34d', dot:'&#128309;' },
      { id:'thisweek', label:'This week', color:'#1e40af', bg:'#eff6ff', border:'#93c5fd', dot:'&#128309;' },
      { id:'upcoming', label:'Upcoming',  color:'#166534', bg:'#f0fdf4', border:'#86efac', dot:'&#128309;' },
      { id:'nodate',   label:'No date',   color:'#6b6860', bg:'#f7f5f0', border:'#e4e2db', dot:'&#9898;' },
    ];
    let html = '';
    buckets.forEach(b => {
      const items = open.filter(t => getDateBucket(t.date) === b.id).sort((a,b) => { const da = parseTaskDate(a.date), db = parseTaskDate(b.date); if (!da && !db) return 0; if (!da) return 1; if (!db) return -1; return da - db; });
      if (!items.length) return;
      html += `
        <div class="date-bucket">
          <div class="date-bucket-header" style="background:${b.bg};border-left:3px solid ${b.border};">
            <span class="date-bucket-label" style="color:${b.color};font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">${b.label}</span>
            <span class="date-bucket-count" style="background:${b.border};color:${b.color};font-family:'DM Mono',monospace;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;">${items.length}</span>
          </div>
          <div class="date-bucket-tasks" style="margin-bottom:20px;">
            ${items.map(t => {
              const tm = TAG_META[t.tag] || TAG_META.pending;
              const catLabel = CATS.find(c=>c.id===t.cat)?.label || t.cat;
              return `<div class="task-row" onclick="openModal('${t.id}')">
                <div class="check${t.done?' checked':''}" onclick="event.stopPropagation();toggleTask('${t.id}')"></div>
                <div class="task-body">
                  <div class="task-text">${t.text}</div>
                  <div class="task-meta">
                    <span class="tag ${tm.cls}">${tm.label}</span>
                    <span style="font-size:10px;padding:2px 8px;border-radius:10px;background:#f0ede8;color:#888;font-weight:500;">${catLabel}</span>
                    ${t.date ? `<span class="task-date">${t.date}</span>` : ''}
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
    });
    if (!html) html = '<div class="empty">No tasks with dates yet — tap any task to add a due date.</div>';
    document.getElementById('task-area').innerHTML = html;
  }

  function render() {
    const urgent = tasks.filter(t=>!t.done&&t.tag==='urgent').length;
    const open   = tasks.filter(t=>!t.done).length;
    const done   = tasks.filter(t=>t.done).length;
    document.getElementById('s-urgent').textContent = urgent;
    document.getElementById('s-open').textContent   = open;
    document.getElementById('s-done').textContent   = done;

    const now = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    document.getElementById('updated-top').textContent = now;

    const TASK_CATS = ['all','bydate','urgent','vehicles','nila','florida','property','legal','personal'];
    const EXP_CATS = ['expenses','lithonia'];
    const renderNavGroup = (ids) => ids.map(id => {
      const cat = CATS.find(x => x.id === id); if (!cat) return '';
      return '<div class="sidebar-item' + (activeTab===id?' active':'') + '" onclick="setTab(\'' + id + '\')">' +
             '<span>' + cat.label + '</span><span class="sidebar-count">' + countFor(id) + '</span></div>';
    }).join('');
    const navHTML = '<div class="sidebar-group-label">Tasks</div>' + renderNavGroup(TASK_CATS) +
                    '<div class="sidebar-group-label" style="margin-top:16px;">Expenses</div>' + renderNavGroup(EXP_CATS);
    document.getElementById('sidebar').innerHTML = navHTML;
    document.getElementById('drawer-nav').innerHTML = navHTML;

    if (activeTab === 'bydate') { renderByDate(); return; }
    const addBar = document.getElementById('add-task-bar');
    if (activeTab === 'expenses') {
      renderExpenses('florida', currentExpView || 'list');
      if (addBar) addBar.style.display = 'none';
      return;
    }
    if (activeTab === 'lithonia') {
      renderExpenses('lithonia', currentExpView || 'list');
      if (addBar) addBar.style.display = 'none';
      return;
    }
    if (addBar) addBar.style.display = 'block';

    // Dashboard date picker (all tasks view only)
    if (activeTab === 'all') {
      const pickerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
        <div style="font-family:'DM Mono',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#aaa;">Filter by date</div>
        <input type="date" id="dash-date-picker" value="${dashDateFilter}"
          onchange="dashDateFilter=this.value;render()"
          style="font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1917;background:#fff;border:1px solid #e4e2db;border-radius:7px;padding:7px 12px;outline:none;cursor:pointer;">
        ${dashDateFilter ? `<button onclick="dashDateFilter='';render()" style="font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;border-radius:6px;border:1px solid #fca5a5;background:#fef2f2;color:#b91c1c;cursor:pointer;">✕ Clear</button>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:#888;">Showing tasks due ${new Date(dashDateFilter+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span>` : ''}
      </div>`;
      const existingPicker = document.getElementById('dash-date-picker-wrap');
      if (!existingPicker) {
        const wrap = document.createElement('div');
        wrap.id = 'dash-date-picker-wrap';
        wrap.innerHTML = pickerHTML;
        const taskArea = document.getElementById('task-area');
        taskArea.parentNode.insertBefore(wrap, taskArea);
      } else {
        existingPicker.innerHTML = pickerHTML;
      }
    } else {
      const picker = document.getElementById('dash-date-picker-wrap');
      if (picker) picker.remove();
    }

    let filtered = activeTab === 'all' ? tasks :
      activeTab === 'urgent' ? tasks.filter(t => t.tag === 'urgent') :
      tasks.filter(t => t.cat === activeTab);

    // Apply dashboard date filter
    if (activeTab === 'all' && dashDateFilter) {
      filtered = filtered.filter(t => {
        if (!t.date) return false;
        const td = parseTaskDate(t.date);
        if (!td) return false;
        const fd = new Date(dashDateFilter + 'T12:00:00');
        return td.getFullYear()===fd.getFullYear() && td.getMonth()===fd.getMonth() && td.getDate()===fd.getDate();
      });
    }
    const openTasks = filtered.filter(t => !t.done);
    const doneTasks = filtered.filter(t => t.done);

    let html = '';
    if (openTasks.length === 0 && doneTasks.length === 0) {
      html = '<div class="empty">Nothing here yet — add a task below.</div>';
    } else {
      html += renderTasksByDateCategory(openTasks, doneTasks);
    }
    document.getElementById('task-area').innerHTML = html;
  }

  function renderTasksByDateCategory(openTasks, doneTasks) {
    const DATE_BUCKETS = [
      { id:'overdue',  label:'Overdue',   color:'#b91c1c', bg:'#fef2f2', border:'#fca5a5' },
      { id:'today',    label:'Today',     color:'#92400e', bg:'#fffbeb', border:'#fcd34d' },
      { id:'thisweek', label:'This week', color:'#1e40af', bg:'#eff6ff', border:'#93c5fd' },
      { id:'upcoming', label:'Upcoming',  color:'#166534', bg:'#f0fdf4', border:'#86efac' },
      { id:'nodate',   label:'No date',   color:'#6b6860', bg:'#f7f5f0', border:'#e4e2db' },
    ];
    const CAT_LABELS = {
      vehicles:'Vehicles / logistics', nila:'Nación Nila', florida:'Florida move',
      property:'Property', legal:'Legal / divorce', personal:'Personal'
    };

    let html = '';

    DATE_BUCKETS.forEach(bucket => {
      const bucketTasks = openTasks.filter(t => getDateBucket(t.date) === bucket.id);
      if (!bucketTasks.length) return;

      // Group by category
      const byCat = {};
      bucketTasks.forEach(t => {
        const cat = t.cat || 'personal';
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(t);
      });

      let catHTML = '';
      Object.entries(byCat).forEach(([cat, catTasks]) => {
        const catLabel = CAT_LABELS[cat] || cat;
        catHTML += `<div style="margin-bottom:14px;">
          <div class="cat-hdr">
            <span class="cat-hdr-label">${catLabel}</span>
            <span class="cat-hdr-count">${catTasks.length}</span>
          </div>
          ${catTasks.map(t => taskHTML(t)).join('')}
        </div>`;
      });

      html += `<div style="margin-bottom:24px;">
        <div style="background:${bucket.bg};border-left:3px solid ${bucket.border};border-radius:2px 2px 0 0;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
          <span style="font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:${bucket.color};">${bucket.label}</span>
          <span style="background:${bucket.border};color:${bucket.color};font-family:'DM Mono',monospace;font-size:10px;padding:2px 10px;border-radius:20px;font-weight:600;">${bucketTasks.length} task${bucketTasks.length!==1?'s':''}</span>
        </div>
        <div style="padding:4px 0 0 0;">${catHTML}</div>
      </div>`;
    });

    // Completed section — flat list at bottom
    if (doneTasks.length) {
      html += `<div class="section">
        <div class="section-header">
          <div class="section-title">Completed</div>
          <div class="section-line"></div>
          <div class="section-count">${doneTasks.length}</div>
        </div>
        ${doneTasks.map(t => taskHTML(t)).join('')}
      </div>`;
    }

    return html || '<div class="empty">Nothing here yet.</div>';
  }

  function section(title, items) {
    return `<div class="section">
      <div class="section-header">
        <div class="section-title">${title}</div>
        <div class="section-line"></div>
        <div class="section-count">${items.length}</div>
      </div>
      ${items.map(taskHTML).join('')}
    </div>`;
  }

  function taskHTML(t) {
    const tm = TAG_META[t.tag] || TAG_META.pending;
    return `<div class="task-row${t.done?' done-row':''}" onclick="openModal('${t.id}')">
      <div class="check${t.done?' checked':''}" onclick="event.stopPropagation();toggleTask('${t.id}')"></div>
      <div class="task-body">
        <div class="task-text${t.done?' struck':''}">${t.text}</div>
        <div class="task-meta">
          ${!t.done ? `<span class="tag ${tm.cls}">${tm.label}</span>` : ''}
          ${t.date ? `<span class="task-date">${t.date}</span>` : ''}

      </div>

  // close modal on overlay click
  document.addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') window.closeModal();
  });


  // ---- EXPENSES ----
  let expenses = JSON.parse(localStorage.getItem('rey_expenses') || '[]');

  function saveExpenses() {
    // local fallback only — Firestore is the source of truth when connected
    localStorage.setItem('rey_expenses', JSON.stringify(expenses));

  }

          || (e.item||'').toLowerCase().includes(q)
          || (e.category||'').toLowerCase().includes(q)
          || (e.location||'').toLowerCase().includes(q)
          || (e.card||'').toLowerCase().includes(q);
        if (!matchesText) return false;
      }
      // Month filter
      if (expMonthFilter && e.date) {
        const [fy, fm] = expMonthFilter.split('-');

        if (ey !== fy || em !== fm) return false;

      return true;

    const total = filteredData.reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);

    const expCardHTML = (e) => `<div class="exp-card" onclick="openExpenseModal('${e.id}','${section}')" style="cursor:pointer;">

    const catTotalsF = Object.entries(byCatF).sort((a,b) => b[1].reduce((s,e)=>s+(parseFloat(e.amount)||0),0) - a[1].reduce((s,e)=>s+(parseFloat(e.amount)||0),0));
    const catView = catTotalsF.length === 0

              <div style="display:flex;align-items:center;gap:8px;">

    document.getElementById('task-area').innerHTML = html;
  }

  
  window.exportToExcel = function(section) {
    const data = section === 'lithonia' ? lithoniaExpenses : expenses;
    const label = section === 'lithonia' ? 'Lithonia' : 'Florida';
    if (!data.length) { alert('No expenses to export.'); return; }
    const headers = ['Date','Store / Vendor','Item / Description','Amount','Category','Payment Card','Location'];
    const rows = [...data].sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).map(e => [
      e.date || '', e.store || '', e.item || '',
      parseFloat(e.amount || 0).toFixed(2),
      e.category || '', e.card || '', e.location || ''
    ]);
    const total = data.reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
    rows.push(['','','TOTAL', total.toFixed(2),'','','']);
    const csv = [headers, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = label + '_Expenses_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  window.toggleAddForm = function() {
    const f = document.getElementById('exp-add-form');
    if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
  };

  window.saveExpenseManual = async function() {
    const store = document.getElementById('exp-store').value.trim();
    const amount = document.getElementById('exp-amount').value;
    const item = document.getElementById('exp-item').value.trim();
    const category = document.getElementById('exp-cat').value;
    const date = document.getElementById('exp-date').value;
    const location = document.getElementById('exp-location').value.trim();
    if (!store && !amount) return;
    const card = document.getElementById('exp-card').value;
    const newExp = { store, amount: parseFloat(amount) || 0, item, category, card, date, location, addedAt: Date.now(), section: activeTab };
    const col = activeTab === 'lithonia' ? lithoniaCol : expensesCol;
    if (firebaseReady) {
      await addDoc(col, newExp);
    } else {
      expenses.push(newExp);
      saveExpenses();
      renderExpenses();
    }
    toggleAddForm();
  };

  window.deleteExpense = async function(id) {
    if (!confirm('Delete this expense?')) return;
    if (firebaseReady && id) {
      await deleteDoc(doc(db, 'expenses', id));
    } else {
      expenses = expenses.filter(e => e.id !== id && e.addedAt !== id);
      saveExpenses();
      renderExpenses();
    }
  };



  // ---- EXPENSE EDIT MODAL ----
  let editingExpId = null;
  let editingExpSection = 'florida';

  window.openExpenseModal = function(id, section) {
    editingExpId = id;
    editingExpSection = section;
    const data = section === 'lithonia' ? lithoniaExpenses : expenses;
    const e = data.find(x => x.id === id);
    if (!e) return;
    document.getElementById('emod-store').value = e.store || '';
    document.getElementById('emod-item').value = e.item || '';
    document.getElementById('emod-amount').value = e.amount || '';
    document.getElementById('emod-card').value = e.card || 'Truist Debit';
    document.getElementById('emod-cat').value = e.category || 'Other';
    document.getElementById('emod-date').value = e.date || '';
    document.getElementById('emod-location').value = e.location || '';
    document.getElementById('exp-modal-overlay').classList.add('open');
  };

  window.closeExpenseModal = function() {
    document.getElementById('exp-modal-overlay').classList.remove('open');
    editingExpId = null;
  };

  window.saveExpenseFromModal = async function() {
    const col = editingExpSection === 'lithonia' ? lithoniaCol : expensesCol;
    const updates = {
      store: document.getElementById('emod-store').value.trim(),
      item: document.getElementById('emod-item').value.trim(),
      amount: parseFloat(document.getElementById('emod-amount').value) || 0,
      card: document.getElementById('emod-card').value,
      category: document.getElementById('emod-cat').value,
      date: document.getElementById('emod-date').value,
      location: document.getElementById('emod-location').value.trim(),
    };
    if (firebaseReady) {
      await updateDoc(doc(db, editingExpSection === 'lithonia' ? 'lithonia' : 'expenses', editingExpId), updates);
      // Firestore listener will re-render automatically
    } else {
      const data = editingExpSection === 'lithonia' ? lithoniaExpenses : expenses;
      const e = data.find(x => x.id === editingExpId);
      if (e) Object.assign(e, updates);
      renderExpenses(editingExpSection, currentExpView || 'list');
    }
    closeExpenseModal();
  };

  window.deleteExpenseFromModal = async function() {
    if (!confirm('Delete this expense?')) return;
    const colName = editingExpSection === 'lithonia' ? 'lithonia' : 'expenses';
    if (firebaseReady) {
      await deleteDoc(doc(db, colName, editingExpId));
    } else {
      if (editingExpSection === 'lithonia') {
        lithoniaExpenses = lithoniaExpenses.filter(x => x.id !== editingExpId);
      } else {
        expenses = expenses.filter(x => x.id !== editingExpId);
      }
      renderExpenses(editingExpSection);
    }
    closeExpenseModal();
  };

  document.addEventListener('click', e => {
    if (e.target.id === 'exp-modal-overlay') window.closeExpenseModal();
  });



</script>

      </div>
    </div>
  </div>

  <!-- ADD TASK MODAL -->
  <div class="modal-overlay" id="add-task-modal">
    <div class="modal">
      <div class="modal-title">New task</div>
      <div class="modal-field">
        <label class="modal-label">Task description</label>

      </div>
      <div class="modal-field">
        <label class="modal-label">Category</label>
        <select class="modal-input" id="new-task-cat">
          <option value="personal">Personal</option>
          <option value="vehicles">Vehicles / logistics</option>
          <option value="nila">Nación Nila</option>
          <option value="florida">Florida move</option>
          <option value="property">Property</option>
          <option value="legal">Legal / divorce</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Priority</label>
        <select class="modal-input" id="new-task-tag">
          <option value="pending">Pending</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Due date (optional)</label>
        <input class="modal-input" id="new-task-date" type="date" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeAddTaskModal()">Cancel</button>
        <button class="btn-save" onclick="submitNewTask()">Add task</button>
      </div>
    </div>
  </div>

  <!-- EXPENSE EDIT MODAL -->
  <div class="modal-overlay" id="exp-modal-overlay">
    <div class="modal">
      <div class="modal-title">Edit expense</div>
      <div class="modal-field">
        <label class="modal-label">Store / Vendor</label>
        <input class="modal-input" id="emod-store" type="text">
      </div>
      <div class="modal-field">
        <label class="modal-label">Item / Description</label>
        <input class="modal-input" id="emod-item" type="text">
      </div>
      <div class="modal-field">
        <label class="modal-label">Amount ($)</label>
        <input class="modal-input" id="emod-amount" type="number" step="0.01">
      </div>
      <div class="modal-field">
        <label class="modal-label">Payment card</label>
        <select class="modal-input" id="emod-card">
          <option>Truist Debit</option>
          <option>American Express</option>
          <option>Chase Mastercard</option>
          <option>Other</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Category</label>
        <select class="modal-input" id="emod-cat">
          <option>Furniture</option><option>Electronics</option>
          <option>Food & Grocery</option><option>Transportation</option>
          <option>Home Supplies</option><option>Clothing</option>
          <option>Gas</option><option>Hotel/Lodging</option><option>Other</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Date</label>
        <input class="modal-input" id="emod-date" type="date">
      </div>
      <div class="modal-field">
        <label class="modal-label">Location</label>
        <input class="modal-input" id="emod-location" type="text">
      </div>
      <div class="modal-actions">
        <button class="btn-delete" onclick="deleteExpenseFromModal()">Delete</button>
        <button class="btn-cancel" onclick="closeExpenseModal()">Cancel</button>
        <button class="btn-save" onclick="saveExpenseFromModal()">Save</button>
      </div>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-left">
      <button class="hamburger" onclick="openDrawer()">☰</button>

    </div>

      <span class="top-meta" id="updated-top"></span>

</div><!-- end #app -->
